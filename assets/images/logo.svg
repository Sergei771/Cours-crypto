<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Tea cup -->
  <path d="M20,40 C20,30 40,30 50,30 C60,30 80,30 80,40 L80,70 C80,80 70,80 50,80 C30,80 20,80 20,70 Z" 
        fill="#ffffff" stroke="#16C79A" stroke-width="3"/>
  
  <!-- Cup handle -->
  <path d="M80,50 C90,50 95,55 95,60 C95,65 90,70 80,70" 
        fill="none" stroke="#16C79A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tea liquid -->
  <path d="M25,45 C25,40 40,40 50,40 C60,40 75,40 75,45 L75,65 C75,70 65,70 50,70 C35,70 25,70 25,65 Z" 
        fill="#0F3460" fill-opacity="0.7"/>
  
  <!-- Steam -->
  <path d="M40,30 C42,25 38,20 40,15 M50,30 C52,25 48,20 50,15 M60,30 C62,25 58,20 60,15" 
        fill="none" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Shadow -->
  <ellipse cx="50" cy="82" rx="25" ry="3" fill="#000000" fill-opacity="0.2"/>
  
  <!-- Encryption/Security elements -->
  <circle cx="50" cy="55" r="10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M45,55 L48,58 L55,51" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg> 